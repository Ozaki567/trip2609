<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美国旅行入口｜行动手册、Citywalk 与记账</title>
<meta name="description" content="美国旅行一级入口：进入行动手册，查看曼哈顿第五大道 Citywalk 路线图，或打开旅行记账网页。">
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(60,60,67,.14);
  --accent: #0071e3;
  --shadow: 0 10px 30px rgba(0,0,0,.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
main {
  width: min(960px, calc(100% - 32px));
  margin: 0 auto;
  padding: 56px 0;
}
.hero { margin-bottom: 28px; }
h1 {
  margin: 0;
  font-size: clamp(34px, 6vw, 64px);
  line-height: 1.05;
  letter-spacing: -0.02em;
}
.subtitle {
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.6;
}
.entry-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.entry {
  display: flex;
  min-height: 260px;
  flex-direction: column;
  justify-content: space-between;
  padding: 24px;
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow);
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--line);
  transition: transform .2s ease, box-shadow .2s ease;
}
.entry:active { transform: scale(.985); }
.kicker {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.entry h2 {
  margin: 10px 0 8px;
  font-size: 28px;
  line-height: 1.15;
  letter-spacing: -0.015em;
}
.entry p {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.6;
}
.arrow {
  display: inline-flex;
  width: 42px;
  height: 42px;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 23px;
  line-height: 1;
}
@media (max-width: 720px) {
  main { padding: 36px 0; }
  .entry-grid { grid-template-columns: 1fr; }
  .entry { min-height: 220px; }
}
</style>
</head>
<body>
<main>
  <section class="hero">
    <h1>美国旅行</h1>
    <p class="subtitle">先选择要看的内容：完整行程安排进入行动手册；曼哈顿第五大道路线图和旅行记账单独查看。</p>
  </section>
  <section class="entry-grid" aria-label="旅行内容入口">
    <a class="entry" href="action-manual.html">
      <div>
        <div class="kicker">Trip Manual</div>
        <h2>行动手册</h2>
        <p>按天查看纽约、黄石大提顿、洛杉矶、旧金山的地图、时间线、餐厅、预约和导航。</p>
      </div>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="entry" href="manhattan-citywalk.html">
      <div>
        <div class="kicker">Citywalk Map</div>
        <h2>曼哈顿 Citywalk 路线图</h2>
        <p>原版独立路线图：Plaza Hotel 起步，沿第五大道到 Washington Square，并可继续延伸到下城。</p>
      </div>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="entry" href="https://ozaki567.github.io/splitwisey2k/?v=4130828">
      <div>
        <div class="kicker">Trip Split</div>
        <h2>旅行记账</h2>
        <p>打开你做的分账网页，记录多人旅行支出、查看人均金额和结算情况。</p>
      </div>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
  </section>
</main>
</body>
</html>
